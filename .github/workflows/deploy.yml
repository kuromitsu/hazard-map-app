name: Deploy to Amazon ECR

on:
  push:
    branches:
      - main  # mainブランチにプッシュされたら実行

env:
  AWS_REGION: ap-northeast-1                   # 東京リージョン
  ECR_REPOSITORY: hazard-map-app               # ECRのリポジトリ名
  # ↓↓↓ ここをSTEP1のURIに合わせて書き換えてください (URIの最初の数字部分がIDです)
  # 例: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/hazard-map-repo の場合
  # 下の行には 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com を入れます（リポジトリ名は含めない）
  ECR_REGISTRY_URI: 846798658286.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  deploy:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        # Dockerビルド
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        # ECRへプッシュ
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
